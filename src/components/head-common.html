<!-- Hide the raw translation keys until main.ts has put in the texts (no flash on Ctrl+F5).
     The keys stay in the HTML on purpose; if main.ts never runs, they show up after 2 s. -->
<script>
  (function () {
    var root = document.documentElement;
    root.classList.add("i18n-pending");
    setTimeout(function () {
      root.classList.remove("i18n-pending");
    }, 2000);
    var title = document.querySelector("title");
    if (title && /^[a-z0-9_]+$/.test(title.textContent)) title.textContent = "Nhywyll";
  })();
</script>

<!-- Early Theme Detection Script -->
<script>
  (function () {
    const savedTheme = localStorage.getItem("theme");
    const systemDark = window.matchMedia(
      "(prefers-color-scheme: dark)",
    ).matches;
    const initialTheme = savedTheme || (systemDark ? "dark" : "light");

    if (initialTheme === "light") {
      document.documentElement.classList.add("light-theme");
      document.documentElement.style.backgroundColor = "#ffffff";
    } else {
      document.documentElement.style.backgroundColor = "#2b2d55";
    }
    document.documentElement.dataset.theme = initialTheme;
  })();
</script>
